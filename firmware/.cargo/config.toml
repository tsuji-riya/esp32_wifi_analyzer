[build]
target = "xtensa-esp32-none-elf"

[target.'cfg(target_arch = "riscv32")']
runner    = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

[target.'cfg(target_arch = "xtensa")']
runner    = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Wl,-Tlinkall.x", "-C", "link-arg=-nostartfiles"]

[env]
ESP_LOG = "info"
# The analyzer's own access point. Override at build time: AP_SSID=... AP_PASSWORD=... cargo run
AP_SSID = { value = "esp32-analyzer", force = false }
AP_PASSWORD = { value = "analyzer1234", force = false }
# needed for AP-STA mode (scan_async subscribes while the driver publishes AP events)
ESP_RADIO_CONFIG_EVENT_CHANNEL_CAPACITY = "4"

[unstable]
build-std = ["alloc", "core"]
